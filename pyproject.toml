[project]
name = "ts-browser-agent"
version = "0.1.0"
description = "A fast browser agent built on langchain-typesafe and the LangChain SDK"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Nathan Drezner", email = "nathan.drezner@langchain.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.15",
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-typesafe>=0.0.1a2",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
